<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyuCloudGaming</title>
    <!-- Iconos premium para el buscador y utilidades -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #111;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: scroll;
        }

        body::-webkit-scrollbar {
            width: 12px;
        }
        body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        body::-webkit-scrollbar-thumb {
            background-color: #107c10;
            border-radius: 6px;
            border: 3px solid #1a1a1a;
        }

        h1 {
            color: #107c10;
            margin-bottom: 25px;
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
        }

        .main-content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .section-block {
            width: 100%;
            background: #161616;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .section-block h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
            border-left: 4px solid #107c10;
            padding-left: 10px;
        }
        .toolbar {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #222;
            padding: 15px 20px;
            border-radius: 10px;
        }
        .search-box {
            position: relative;
            flex: 1;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: #1a1a1a;
            border: 2px solid transparent;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: #107c10;
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        .sort-box select {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #107c10;
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.2);
        }
        
        .game-card-art {
            width: 100%;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        }
        
        .game-card-title {
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: #1e1e1e;
            color: #fff;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>AyuCloudGaming</h1>

    <div class="main-content">
        <section class="section-block">
            <h2>Catálogo Oficial de Juegos</h2>
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Buscar juego...">
                </div>
                <div class="sort-box">
                    <select id="sortInput">
                        <option value="mas-jugados">🔥 Los más jugados</option>
                        <option value="alfabetico">🔤 Orden alfabético</option>
                        <option value="novedades">✨ Novedades</option>
                    </select>
                </div>
            </div>
            <div class="games-grid" id="gamesGrid"></div>
        </section>
    </div>

    <!-- Forzamos de forma dinámica que el botón de refrescar superior lea los cambios -->
    <script>
        const script = document.createElement('script');
        script.src = 'client.js?cache=' + Date.now();
        document.body.appendChild(script);
    </script>
</body>
</html>
