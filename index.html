<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyuCloudGaming</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            font-size: 2.5rem;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
            height: 220px;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #107c10;
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.2);
        }

        .game-icon {
            font-size: 3.5rem;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        }

        .game-card-title {
            background-color: #1a1a1a;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>AyuCloudGaming</h1>

    <div class="main-content">
        <div class="games-grid">

            <a href="juegos/subway-surfers.html" class="game-card">
                <div class="game-icon">🏃</div>
                <div class="game-card-title">Subway Surfers</div>
            </a>

            <a href="juegos/minecraft.html" class="game-card">
                <div class="game-icon">🧱</div>
                <div class="game-card-title">Minecraft</div>
            </a>

            <a href="juegos/geometry-dash.html" class="game-card">
                <div class="game-icon">📐</div>
                <div class="game-card-title">Geometry Dash</div>
            </a>

            <a href="juegos/brawl-stars.html" class="game-card">
                <div class="game-icon">⭐</div>
                <div class="game-card-title">Brawl Stars</div>
            </a>

            <a href="juegos/subnautica.html" class="game-card">
                <div class="game-icon">🌊</div>
                <div class="game-card-title">Subnautica</div>
            </a>

            <a href="juegos/fall-guys.html" class="game-card">
                <div class="game-icon">👑</div>
                <div class="game-card-title">Fall Guys</div>
            </a>

            <a href="juegos/rodeo-stampede.html" class="game-card">
                <div class="game-icon">🤠</div>
                <div class="game-card-title">Rodeo Stampede</div>
            </a>

            <a href="juegos/fortnite.html" class="game-card">
                <div class="game-icon">🪂</div>
                <div class="game-card-title">Fortnite</div>
            </a>

            <!-- Cuadradito de Steam perfectamente integrado -->
            <a href="https://steampowered.com" target="_blank" class="game-card" style="background: linear-gradient(135deg, #1b2838, #2a475e);">
                <div class="game-icon" style="background: transparent;">🎮</div>
                <div class="game-card-title">Steam</div>
            </a>

        </div>
    </div>

</body>
</html>
