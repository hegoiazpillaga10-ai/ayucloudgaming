<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Plataforma de Cloud Gaming</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #stream-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
            border: 3px solid #00ff00;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Mi Servidor Xbox Cloud Casero</h1>
    
    <div id="stream-container">
        <div id="status">Estado: Conectando al servidor de streaming...</div>
        <video id="remoteVideo" autoplay playsinline muted></video>
    </div>

    <div class="controls-info">
        Controles: Usa las flechas de dirección (⬆️ ⬇️ ⬅️ ➡️) para jugar.
    </div>

    <script src="https://socket.io"></script>
    <script src="client.js"></script>
</body>
</html>
