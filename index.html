<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyuCloudGaming</title>
    <!-- Iconos premium para el buscador y utilidades -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Barra de scroll suave y natural a la derecha estilo GitHub */
        body {
            background-color: #111;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: scroll;
        }

        /* Diseño premium para la barra de scroll derecha */
        body::-webkit-scrollbar {
            width: 12px;
        }
        body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        body::-webkit-scrollbar-thumb {
            background-color: #107c10; /* Verde Xbox */
            border-radius: 6px;
            border: 3px solid #1a1a1a;
        }

        h1 {
            color: #107c10;
            margin-bottom: 25px;
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
        }

        .main-content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        /* ================= SECCIÓN 1: EL CATÁLOGO ================= */
        .section-block {
            width: 100%;
            background: #161616;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .section-block h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ccc;
            border-left: 4px solid #107c10;
            padding-left: 10px;
        }
        .toolbar {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #222;
            padding: 15px 20px;
            border-radius: 10px;
        }
        .search-box {
            position: relative;
            flex: 1;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: #1a1a1a;
            border: 2px solid transparent;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: #107c10;
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        .sort-box select {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        /* Cuadrícula de juegos fluida */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #107c10;
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.2);
        }
        .game-card img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background-color: #1a1a1a;
        }
        .game-card-title {
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: #1e1e1e;
            color: #fff;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= SECCIÓN 2: EL REPRODUCTOR ================= */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            padding: 12px 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .fullscreen-btn:hover {
            background-color: #107c10;
            border-color: #107c10;
        }

        /* ================= SECCIÓN 3: DOCUMENTO INFO ================= */
        .info-document {
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            border-left: 5px solid #107c10;
            line-height: 1.6;
        }
        .info-document h3 { margin-bottom: 15px; color: #107c10; }
        .info-document p { margin-bottom: 12px; color: #ccc; }
    </style>
</head>
<body>

    <h1>AyuCloudGaming</h1>

    <div class="main-content">
        
        <!-- SECCIÓN 1: EXPLORAR JUEGOS -->
        <section class="section-block">
            <h2>Catálogo de Juegos</h2>
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Buscar juego específico...">
                </div>
                <div class="sort-box">
                    <select id="sortInput">
                        <option value="mas-jugados">🔥 Los más jugados</option>
                        <option value="alfabetico">🔤 Orden alfabético</option>
                        <option value="novedades">✨ Novedades</option>
                    </select>
                </div>
            </div>
            <div class="games-grid" id="gamesGrid"></div>
        </section>

        <!-- SECCIÓN 2: PANTALLA DE JUEGO -->
        <section class="section-block" id="streamSection">
            <h2>Consola en Directo</h2>
            <div class="player-wrapper" id="videoPlayer">
                <iframe id="gameFrame" src="about:blank" style="background: #000;"></iframe>
                <button class="fullscreen-btn" id="fullscreenBtn" title="Pantalla Completa">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </section>

        <!-- SECCIÓN 3: INFORMACIÓN -->
        <section class="info-document">
            <h3>Información del Sistema</h3>
            <p>Bienvenido a AyuCloudGaming. Esta plataforma emula la experiencia de juego en la nube de forma totalmente integrada y gratuita.</p>
            <p><strong>Estado del sistema:</strong> Operacional y Libre de bloqueos de red externos.</p>
        </section>

    </div>

    <!-- Forzamos una versión nueva del script (v3) para destruir la caché del navegador -->
    <script src="client.js?v=3"></script>
</body>
</html>
