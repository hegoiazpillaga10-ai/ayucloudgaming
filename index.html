<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyuCloudGaming</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            font-size: 2.5rem;
        }

        /* Reducido el ancho máximo para que los cuadraditos se vuelvan más delgados */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Fuerza las 4 columnas con mayor separación para estilizar el diseño */
        .games-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 25px !important;
        }

        /* Adaptación automática para pantallas móviles */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)) !important;
                gap: 15px !important;
            }
        }

        .game-card {
            background-color: #222;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
            height: 220px;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #107c10;
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.2);
        }

        .game-icon {
            font-size: 3.5rem;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        }

        .game-card-title {
            background-color: #1a1a1a;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-top: 1px solid #333;
        }

        /* Colores de las redes sociales */
        .twitch-card { background: linear-gradient(135deg, #4b367c, #6441a5) !important; }
        .tiktok-card { background: linear-gradient(135deg, #010101, #25f4ee, #fe0979) !important; }
        .instagram-card { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important; }
    </style>
</head>
<body>

    <h1>AyuCloudGaming</h1>

    <div class="main-content">
        <div class="games-grid">

            <!-- Fila 1 -->
            <a href="https://xbox.com" target="_blank" class="game-card">
                <div class="game-icon">🟢</div>
                <div class="game-card-title">Xbox Cloud Gaming</div>
            </a>

            <a href="https://geforcenow.com" target="_blank" class="game-card">
                <div class="game-icon">💚</div>
                <div class="game-card-title">Nvidia</div>
            </a>

            <a href="https://steampowered.com" target="_blank" class="game-card" style="background: linear-gradient(135deg, #1b2838, #2a475e);">
                <div class="game-icon" style="background: transparent;">🎮</div>
                <div class="game-card-title">Steam</div>
            </a>

            <a href="#" target="_blank" class="game-card tiktok-card">
                <div class="game-icon" style="background: transparent;">🎵</div>
                <div class="game-card-title">TikTok</div>
            </a>

            <!-- Fila 2 -->
            <a href="#" target="_blank" class="game-card instagram-card">
                <div class="game-icon" style="background: transparent;">📸</div>
                <div class="game-card-title">Instagram</div>
            </a>

            <a href="#" target="_blank" class="game-card twitch-card">
                <div class="game-icon" style="background: transparent;">🔮</div>
                <div class="game-card-title">Twitch</div>
            </a>

            <a href="https://poki.com" target="_blank" class="game-card">
                <div class="game-icon">🏃</div>
                <div class="game-card-title">Subway Surfers</div>
            </a>

            <a href="https://eaglercraft.com" target="_blank" class="game-card">
                <div class="game-icon">🧱</div>
                <div class="game-card-title">Minecraft (Eaglecraft)</div>
            </a>

            <!-- Fila 3 -->
            <a href="https://crazygames.com" target="_blank" class="game-card">
                <div class="game-icon">📐</div>
                <div class="game-card-title">Geometry Dash</div>
            </a>

            <a href="https://easyfun.gg" target="_blank" class="game-card">
                <div class="game-icon">⭐</div>
                <div class="game-card-title">Brawl Stars</div>
            </a>

            <a href="https://xbox.com" target="_blank" class="game-card">
                <div class="game-icon">🌊</div>
                <div class="game-card-title">Subnautica</div>
            </a>

            <a href="https://xbox.com" target="_blank" class="game-card">
                <div class="game-icon">👑</div>
                <div class="game-card-title">Fall Guys</div>
            </a>

            <!-- Fila 4 -->
            <a href="https://poki.com" target="_blank" class="game-card">
                <div class="game-icon">🤠</div>
                <div class="game-card-title">Rodeo Stampede</div>
            </a>

            <a href="https://xbox.com/games/fortnite/bt5p2x999vh2" target="_blank" class="game-card">
                <div class="game-icon">🪂</div>
                <div class="game-card-title">Fortnite</div>
            </a>

            <a href="https://crazygames.com" target="_blank" class="game-card">
                <div class="game-icon">🎣</div>
                <div class="game-card-title">How to Fish</div>
            </a>

            <a href="https://peak.net" target="_blank" class="game-card">
                <div class="game-icon">🏔️</div>
                <div class="game-card-title">Peak</div>
            </a>

            <!-- Fila 5 -->
            <a href="https://xbox.com/games/rocket-league/c125w9bg2k0v" target="_blank" class="game-card">
                <div class="game-icon">⚽🏎️</div>
                <div class="game-card-title">Rocket League</div>
            </a>

        </div>
    </div>

</body>
</html>
